name: Build portable Windows app

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: portable-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Extra safety: never enable R2R via environment
  PublishReadyToRun: false

jobs:
  build:
    name: win-x64 portable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Pin SDK 9 (ignore host SDK 10)
        shell: pwsh
        run: |
          $line = dotnet --list-sdks |
            Where-Object { $_ -match '^9\.' } |
            Select-Object -Last 1
          if (-not $line) { throw 'No .NET 9 SDK installed on runner' }
          if ($line -notmatch '^(?<ver>\d+\.\d+\.\d+)') { throw "Cannot parse SDK: $line" }
          $ver = $Matches['ver']
          @{
            sdk = @{
              version = $ver
              rollForward = 'latestFeature'
            }
          } | ConvertTo-Json | Set-Content -Path global.json -Encoding utf8
          Write-Host "global.json -> SDK $ver"
          Get-Content global.json
          Write-Host '---'
          dotnet --version
          dotnet --list-sdks

      - name: Read version
        id: meta
        shell: pwsh
        run: |
          $xml = [xml](Get-Content -Raw .\DocumentGenerator.csproj)
          $version = @(
            $xml.Project.PropertyGroup |
              ForEach-Object { $_.Version } |
              Where-Object { $_ }
          ) | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Version not found in DocumentGenerator.csproj'
          }
          $name = "Docugen-$version-portable-win-x64"
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact=$name" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version=$version artifact=$name"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\DocumentGenerator.csproj `
            --runtime win-x64 `
            -p:PublishReadyToRun=false `
            -p:PublishSingleFile=false
          if ($LASTEXITCODE -ne 0) { throw "restore failed ($LASTEXITCODE)" }

      - name: Publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = '${{ steps.meta.outputs.artifact }}'
          $out  = Join-Path $env:GITHUB_WORKSPACE 'publish' $name

          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          Write-Host "Output: $out"
          Write-Host "dotnet: $(dotnet --version)"

          # Stable portable layout for WPF + SQLite:
          # self-contained folder, NO single-file, NO ReadyToRun
          dotnet publish .\DocumentGenerator.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishReadyToRun=false `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output $out

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed ($LASTEXITCODE)"
          }

          $exe = Join-Path $out 'DocumentGenerator.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Missing DocumentGenerator.exe in $out"
          }

          $sqlite = Get-ChildItem -Path $out -Filter 'e_sqlite3.dll' -Recurse -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          if (-not $sqlite) {
            throw 'Missing e_sqlite3.dll (SQLite native)'
          }

          $files = Get-ChildItem -Path $out -File -Recurse
          $mb = [math]::Round((($files | Measure-Object -Property Length -Sum).Sum) / 1MB, 1)
          Write-Host ("OK: {0} files, {1} MB, exe={2:N0} bytes" -f $files.Count, $mb, (Get-Item $exe).Length)
          Write-Host "SQLite: $($sqlite.FullName)"

          # Optional extras (ignore if missing)
          $map = @{
            'README.md'           = 'README.txt'
            'App.ico'             = 'App.ico'
            'Start-Docugen.cmd'   = 'Start-Docugen.cmd'
            'Create-Shortcut.cmd' = 'Create-Shortcut.cmd'
            'create-shortcut.ps1' = 'create-shortcut.ps1'
          }
          foreach ($src in $map.Keys) {
            if (Test-Path -LiteralPath $src) {
              Copy-Item -LiteralPath $src -Destination (Join-Path $out $map[$src]) -Force
            }
          }
          if (Test-Path -LiteralPath 'samples') {
            Copy-Item -LiteralPath 'samples' -Destination (Join-Path $out 'samples') -Recurse -Force
          }

          $zip = Join-Path $env:GITHUB_WORKSPACE 'publish' "$name.zip"
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -Force
          Write-Host "ZIP: $zip ($([math]::Round((Get-Item $zip).Length/1MB,1)) MB)"

          "ZIP_PATH=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_NAME=$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "$env:ZIP_PATH" `
            --title "Docugen ${{ steps.meta.outputs.version }}" `
            --generate-notes `
            --clobber
